[project]
name = "mytaskmanager"
version = "0.1.0"
description = "My CLI task manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "typer>=0.27.2",
]

[project.scripts]
mytaskmanager = "task_manager.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["task_manager"]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Selected linters:
# "E", "W": pycodestyle errors and warnings
# "F": Pyflakes (detects unused imports, undefined variables, etc.)
# "I": isort (sorts and formats imports)
# "B": flake8-bugbear (finds potential bugs and design flaws)
# "D": pydocstyle (enforces docstring style standards)
select = ["E", "W", "F", "I", "B", "D"]

# Ignored rules:
# B008: Do not perform function call in argument defaults (required for Typer / FastAPI dependencies)
# D100: Missing docstring in public module
# D104: Missing docstring in public package
# D203: Incorrect blank line before class (conflicts with D211)
# D213: Multi-line summary second line (conflicts with D212)
ignore = ["B008", "D100", "D104", "D203", "D213"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest_tmp"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["task_manager"]

[tool.vulture]
paths = ["task_manager", "tests", "main.py"]
min_confidence = 80
ignore_decorators = ["@app.*", "@pytest.fixture"]
